<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1">
    <title>ลงทะเบียนเพื่อเข้าสู่ระบบ</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="global.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-menu">
            <span onclick="nextPage('11.html')" class="textButton fwB size12">< ย้อนกลับ</span>
        </div>
        <div class="header-buttons">
            <span onclick="nextPage('27.html')" class="textButton fwB size12">บันทึก</span>
        </div>
    </header>
    <div class="container__25">
        <div class="title title--small color-primary taL">Create Project</div>
        <div class="subtitle taL size12">สร้างโปรเจคใหม่ของคุณ โดยกรอกข้อมูลรายละเอียดให้ครบ</div>
        <div class="container_25--icon">
            <div class="add_image">
                <img src="images/plus-solid-white.svg">
            </div>
        </div>
        
        <form>
            <h3>รายเอียดข้อมูลของโปรเจค</h3>
            <div class="form-group mb50">
                <label for="username">รหัสโปรเจค</label>
                <div class="input-container">
                    <input placeholder="กรุณากรอกรหัสโปรเจค">
                </div>
            </div>
            <div class="form-group mb50">
                <label for="email">ชื่อโปรเจค</label>
                <div class="input-container">
                    <input type="email" id="email" name="email" placeholder="กรุณากรอกชื่อโปรเจค">
                </div>
            </div>
            <div class="form-group mb50">
                <label for="password">ชื่อลูกค้า</label>
                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder="กรุณากรอกชื่อลูกค้า">
                </div>                
            </div>
            <div class="form-group mb50">
                <label for="confirm-password">นามสกุลลูกค้า</label>
                <div class="input-container">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="กรุณากรอกนามสกุลลูกค้า">
                </div>                
            </div>
            <div class="form-group mb50">
                <label for="username">เบอร์โทรศัพท์ติดต่อ</label>
                <div class="input-container">
                    <input placeholder="กรุณากรอกเบอร์โทรศัพท์ติดต่อ">
                </div>
            </div>
            <div class="form-group mb50">
                <label for="username">วันเริ่มโปรเจค</label>
                <div class="input-container">
                    <input placeholder="กรุณากรอกวันเริ่มโปรเจค">
                </div>
            </div>
            <div class="form-group mb50">
                <label for="username">วันสิ้นสุดโปรเจค</label>
                <div class="input-container">
                    <input placeholder="กรุณากรอกวันสิ้นสุดโปรเจค">
                </div>
            </div>
            <div style="text-align: left;" class="card-04__heading">
                รายละเอียดขั้นตอนการทำงาน
            </div>
            <div class="form-group form-group--big mt10">
                <div class="input-container input-container--big">
                    <textarea placeholder="กรุณากรอกสถานที่ดำเนินการ"></textarea>
                </div>
            </div>
            
        </form>
    </div>
    <script>
        function togglePasswordVisibility(id) {
            var input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }
    </script>
</body>
</html>
