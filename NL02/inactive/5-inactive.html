<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrollable Carousel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .carousel {
            width: 80%;
            max-width: 800px;
            overflow: hidden;
            position: relative;
        }
        .carousel-inner {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .carousel-item {
            flex: 0 0 70%;
            margin: 0 2.5%;
            box-sizing: border-box;
            opacity: 0.5;
            transform: scale(0.9);
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
        }
        .carousel-item.active {
            opacity: 1;
            transform: scale(1);
        }
        .carousel img {
            width: 100%;
            display: block;
        }
        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
        }
        .carousel-button {
            background-color: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="https://via.placeholder.com/600x400" alt="Slide 1">
        </div>
        <div class="carousel-item">
            <img src="https://via.placeholder.com/600x400" alt="Slide 2">
        </div>
        <div class="carousel-item">
            <img src="https://via.placeholder.com/600x400" alt="Slide 3">
        </div>
    </div>
    <div class="carousel-controls">
        <button class="carousel-button" id="prevBtn">❮</button>
        <button class="carousel-button" id="nextBtn">❯</button>
    </div>
</div>

<script>
    const carouselInner = document.querySelector('.carousel-inner');
    const items = document.querySelectorAll('.carousel-item');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let currentIndex = 0;

    function updateCarousel() {
        items.forEach((item, index) => {
            item.classList.remove('active');
            if (index === currentIndex) {
                item.classList.add('active');
            }
        });
        const scrollAmount = items[currentIndex].offsetLeft - carouselInner.offsetLeft - (carouselInner.clientWidth - items[currentIndex].clientWidth) / 2;
        carouselInner.scrollTo({
            left: scrollAmount,
            behavior: 'smooth'
        });
    }

    prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex > 0) ? currentIndex - 1 : items.length - 1;
        updateCarousel();
    });

    nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex < items.length - 1) ? currentIndex + 1 : 0;
        updateCarousel();
    });

    window.addEventListener('resize', updateCarousel);
    window.addEventListener('load', updateCarousel);
</script>

</body>
</html>
